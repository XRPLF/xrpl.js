name: Check PR description

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

permissions:
  contents: read

jobs:
  check_description:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO: replace with the XRPLF/actions commit once XRPLF/actions merges
      # check-pr-description.
      - name: Check PR description differs from template
        uses: mvadari/actions/check-pr-description@0532aa0541b438f034133f266717a1113f92da68
