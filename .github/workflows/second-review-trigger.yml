# Starts a `second-review` evaluation in second-review.yml when a review changes.
#
# GitHub has no trusted (`*_target`) version of review events, so this runs in
# the PR's context, where forks get a read-only token and the workflow file
# comes from the PR itself. It only records which PR changed, in its run name;
# second-review.yml runs on `workflow_run` from the default branch, reads the
# PR's current state from the API and posts the status. If a PR edits this file
# to drop events, approvals just stop updating the status, so a failing check
# stays failing. Label, push and open events are handled by second-review.yml
# directly. Don't require this workflow's check.

name: Second review trigger
run-name: "Second review trigger for PR #${{ github.event.pull_request.number }}"

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  second-review-trigger:
    # Thread replies and comment-only reviews arrive as `submitted` reviews too,
    # but they can't change the approval count, so skip them. GitHub can't
    # filter review events by state in `on:`, so they show up as skipped.
    if: >-
      github.event.action == 'dismissed' ||
      github.event.review.state == 'approved' ||
      github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event.action }}
        run: |
          echo "Requesting a second-review evaluation for PR #${PR_NUMBER} (review ${EVENT})."
